name: PR template

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python -c "import os, pathlib; pathlib.Path('pr-body.md').write_text(os.environ.get('PR_BODY') or '', encoding='utf-8')"

      - name: Check pull request body
        run: python tools/check_pr_body.py pr-body.md
