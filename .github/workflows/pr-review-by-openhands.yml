# OpenHands PR Review Workflow
#
# Setup:
# 1. Install the OpenHands GitHub App on the organization that owns this repository.
# 2. Add LLM_API_KEY to the organization or repository Actions secrets.
# 3. Create a review-this label, or request openhands-agent as a reviewer.
#
# https://github.com/OpenHands/software-agent-sdk/tree/main/examples/03_github_workflows/02_pr_review

name: PR Review by OpenHands

on:
  pull_request:
    types: [labeled, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-review:
    if: |
      github.event.label.name == 'review-this' ||
      github.event.requested_reviewer.login == 'openhands-agent'
    runs-on: ubuntu-latest
    steps:
      - name: Run PR Review
        uses: OpenHands/extensions/plugins/pr-review@main
        with:
          llm-model: gpt-5.5
          llm-base-url: ''
          review-style: roasted
          llm-api-key: ${{ secrets.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lmnr-api-key: ${{ secrets.LMNR_PROJECT_API_KEY }}
